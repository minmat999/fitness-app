$kind: http-request
url: "{{baseUrl}}/goals/{{goalId}}/logs/{{newLogId}}/entries"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"foodId":"{{newFoodId}}","mealType":"breakfast","quantityGrams":200,"eatenAt":"08:30"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('entryId', pm.response.json().id);
    language: text/javascript
order: 16000
