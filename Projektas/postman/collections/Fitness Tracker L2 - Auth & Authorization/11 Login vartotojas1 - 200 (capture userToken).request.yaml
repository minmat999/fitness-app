$kind: http-request
description: Prisijungia paprastas naudotojas vartotojas1. Issaugomas jo tokenas (userToken) ir ID (user1Id). Kartu serveris nustato refresh cookie (naudojamas 19 teste).
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "vartotojas1@example.com", "password": "Vartotojas123!"}'
scripts:
  - type: afterResponse
    code: |-
      // Prisijungia paprastas naudotojas vartotojas1. Issaugomas jo tokenas (userToken) ir ID (user1Id). Kartu serveris nustato refresh cookie (naudojamas 19 teste).
      {
      pm.test('200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.collectionVariables.set('userToken', data.accessToken);
      pm.collectionVariables.set('user1Id', data.user.id);
      pm.test('role user', () => pm.expect(data.user.role).to.eql('user'));
      }
    language: text/javascript
order: 11000
