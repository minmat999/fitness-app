$kind: http-request
description: Prisijungimas su neteisingu slaptazodziu. Serveris turi atsakyti 401 Unauthorized ir neisduoti tokeno.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "admin@example.com", "password": "neteisingas"}'
scripts:
  - type: afterResponse
    code: |-
      // Prisijungimas su neteisingu slaptazodziu. Serveris turi atsakyti 401 Unauthorized ir neisduoti tokeno.
      pm.test('401 - neteisingas slaptazodis', () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
