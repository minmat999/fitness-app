$kind: http-request
description: Administratorius gauna tikslu sarasa - jis mato visu naudotoju tikslus (daugiau nei 1).
url: "{{baseUrl}}/goals"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      // Administratorius gauna tikslu sarasa - jis mato visu naudotoju tikslus (daugiau nei 1).
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('admin mato daugiau nei 1 tiksla', () => pm.expect(pm.response.json().data.length).to.be.above(1));
    language: text/javascript
order: 13000
