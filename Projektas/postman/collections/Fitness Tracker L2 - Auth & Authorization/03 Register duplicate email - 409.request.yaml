    code: |-
      // Bando registruotis su tuo paciu el. pastu kaip 02 teste. Serveris turi atsakyti 409 Conflict - toks naudotojas jau yra.
      pm.test('409 - el. pastas jau uzimtas', () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
