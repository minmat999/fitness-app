$kind: http-request
description: Bando registruotis su tuo paciu el. pastu kaip 02 teste. Serveris turi atsakyti 409 Conflict - toks naudotojas jau yra.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "{{newUserEmail}}", "password": "Kitas123!"}'
scripts:
