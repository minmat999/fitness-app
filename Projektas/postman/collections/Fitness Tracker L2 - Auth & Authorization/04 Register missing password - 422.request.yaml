$kind: http-request
description: Registracija be slaptazodzio. Serveris turi atsakyti 422 - truksta privalomo lauko.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "nepilnas@example.com"}'
scripts:
  - type: afterResponse
    code: |-
      // Registracija be slaptazodzio. Serveris turi atsakyti 422 - truksta privalomo lauko.
      pm.test('422 - truksta slaptazodzio', () => pm.response.to.have.status(422));
    language: text/javascript
order: 4000
