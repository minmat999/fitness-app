$kind: http-request
description: Po atsijungimo bandoma atnaujinti tokena. Refresh tokenas jau atsauktas, todel serveris atsako 401.
url: "{{baseUrl}}/auth/refresh"
method: POST
scripts:
  - type: afterResponse
    code: |-
      // Po atsijungimo bandoma atnaujinti tokena. Refresh tokenas jau atsauktas, todel serveris atsako 401.
      pm.test('401 - refresh tokenas atsauktas', () => pm.response.to.have.status(401));
    language: text/javascript
order: 21000
