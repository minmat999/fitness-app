$kind: http-request
description: Gaunamas naujas access tokenas naudojant refresh tokena is httpOnly cookie (Postman ja issaugojo 11 teste). Senas refresh tokenas atsaukiamas, isduodamas naujas (rotacija).
url: "{{baseUrl}}/auth/refresh"
method: POST
scripts:
  - type: afterResponse
    code: |-
      // Gaunamas naujas access tokenas naudojant refresh tokena is httpOnly cookie (Postman ja issaugojo 11 teste). Senas refresh tokenas atsaukiamas, isduodamas naujas (rotacija).
      pm.test('200 - gautas naujas access tokenas', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('userToken', pm.response.json().accessToken);
    language: text/javascript
order: 19000
