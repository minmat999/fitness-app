$kind: http-request
url: "{{baseUrl}}/foods"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name":"Postman testinis maistas","caloriesPer100g":150,"proteinPer100g":10,"carbsPer100g":15,"fatPer100g":5}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('newFoodId', pm.response.json().id);
    language: text/javascript
order: 13000
