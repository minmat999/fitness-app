$kind: http-request
url: "{{baseUrl}}/foods?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      if (data.data && data.data.length) pm.collectionVariables.set('foodId', data.data[0].id);
    language: text/javascript
order: 10000
