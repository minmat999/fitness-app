$kind: http-request
url: "{{baseUrl}}/goals?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('has pagination', () => pm.expect(data).to.have.property('pagination'));
      if (data.data && data.data.length) pm.collectionVariables.set('goalId', data.data[0].id);
    language: text/javascript
order: 2000
