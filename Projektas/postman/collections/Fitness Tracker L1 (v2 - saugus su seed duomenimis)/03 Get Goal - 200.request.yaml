$kind: http-request
url: "{{baseUrl}}/goals/{{goalId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('has _links', () => pm.expect(pm.response.json()).to.have.property('_links'));
    language: text/javascript
order: 3000
