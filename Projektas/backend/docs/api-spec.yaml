# FitnessTracker API specifikacija. Perziura narsykleje: /api/docs (Swagger UI).
openapi: 3.0.3
info:
  title: FitnessTracker API
  version: 2.0.0
  description: |-
    Mitybos ir sveikatos tikslų sekimo sistemos REST API.

    Hierarchija: **Tikslas (Goal) → Dienos įrašas (DailyLog) → Valgymas (FoodEntry)**, valgymas nurodo produktą iš **maisto katalogo (Food)**.

    Autentifikacija: prisijungus gaunamas JWT prieigos žetonas, kuris siunčiamas antraštėje `Authorization: Bearer <žetonas>`. Atnaujinimo žetonas laikomas httpOnly slapuke `refreshToken`.

    Rolės: neregistruotas naudotojas (svečias), `user`, `admin`. Visi atsakymai – JSON formatu; klaidos grąžinamos kaip `{"error": "..."}`.
servers:
- url: /api
  description: Publikuota versija (Azure App Service)
- url: http://localhost:3000/api
  description: Lokali kūrimo aplinka
tags:
- name: Autentifikacija
- name: Maisto katalogas
- name: Tikslai
- name: Dienos įrašai
- name: Valgymai
- name: Naudotojai
- name: Sistema
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Autentifikacija
      summary: Naudotojo registracija
      description: |-
        Sukuria naują naudotojo paskyrą. Slaptažodis saugomas bcrypt maiša, naujam naudotojui visada priskiriama rolė „user“ (kliento atsiųsta rolė ignoruojama).

        **Prieiga:** Nereikia
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: naujas@example.com
              password: Naujas123!
      responses:
        '201':
          description: Paskyra sukurta
          content:
            application/json:
              example:
                id: 7
                email: naujas@example.com
                role: user
        '409':
          description: Toks el. paštas jau užregistruotas
          content:
            application/json:
              example:
                error: Sis el. pastas jau uzregistruotas
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Trūksta privalomų laukų arba netinkamas el. pašto formatas
          content:
            application/json:
              example:
                error: 'Truksta lauku: password'
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Autentifikacija
      summary: Prisijungimas
      description: |-
        Patikrina el. paštą ir slaptažodį. Grąžina trumpalaikį prieigos (access) žetoną (15 min.), o ilgalaikį atnaujinimo (refresh) žetoną (7 d.) nustato httpOnly slapuke refreshToken.

        **Prieiga:** Nereikia
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: vartotojas1@example.com
              password: Vartotojas123!
      responses:
        '200':
          description: Prisijungta, grąžinamas prieigos žetonas ir naudotojo duomenys
          content:
            application/json:
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIsInJvbGUiOiJ1c2VyIiwiaWF0IjoxNzk0NDI3NjgwLCJleHAiOjE3OTQ0Mjg1ODB9.qvGdhpU5XC6c7D-PLoUskzgY1Mc2-nxYG1SrQ2YNSnU
                user:
                  id: 2
                  email: vartotojas1@example.com
                  role: user
          headers:
            Set-Cookie:
              description: refreshToken=<JWT>; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
              schema:
                type: string
        '401':
          description: Neteisingas el. paštas arba slaptažodis
          content:
            application/json:
              example:
                error: Neteisingas el. pastas arba slaptazodis
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Trūksta el. pašto arba slaptažodžio
          content:
            application/json:
              example:
                error: 'Truksta lauku: password'
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - Autentifikacija
      summary: Prieigos žetono atnaujinimas
      description: |-
        Pagal refreshToken slapuką išduoda naują prieigos žetoną. Senas atnaujinimo žetonas atšaukiamas ir išduodamas naujas (rotacija).

        **Prieiga:** Atnaujinimo žetonas slapuke refreshToken
      operationId: refresh
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Išduotas naujas prieigos žetonas
          content:
            application/json:
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIsInJvbGUiOiJ1c2VyIiwiaWF0IjoxNzk0NDI3NjgxLCJleHAiOjE3OTQ0Mjg1ODF9.KNYHjX31B-m0PMaxtQs_2u6Ua-b5KG5eREQHz2tWlHg
          headers:
            Set-Cookie:
              description: refreshToken=<JWT>; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
              schema:
                type: string
        '401':
          description: Slapuko nėra, žetonas negalioja arba yra atšauktas
          content:
            application/json:
              example:
                error: Nerastas refresh tokenas
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - Autentifikacija
      summary: Atsijungimas
      description: |-
        Atšaukia atnaujinimo žetoną duomenų bazėje ir ištrina refreshToken slapuką.

        **Prieiga:** Atnaujinimo žetonas slapuke refreshToken
      operationId: logout
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Atsijungta
  /auth/me:
    get:
      tags:
      - Autentifikacija
      summary: Prisijungusio naudotojo duomenys
      description: |-
        Grąžina naudotoją, kurio ID nurodytas prieigos žetone.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: me
      responses:
        '200':
          description: Naudotojo duomenys
          content:
            application/json:
              example:
                id: 2
                email: vartotojas1@example.com
                role: user
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
  /foods:
    get:
      tags:
      - Maisto katalogas
      summary: Maisto produktų sąrašas
      description: |-
        Grąžina maisto katalogą su puslapiavimu. Galima ieškoti pagal pavadinimo dalį.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: foods_list
      parameters:
      - name: page
        in: query
        required: false
        description: Puslapio numeris (numatytasis 1)
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Įrašų skaičius puslapyje (1–50, numatytasis 10)
        schema:
          type: integer
      - name: search
        in: query
        required: false
        description: Pavadinimo dalis paieškai
        schema:
          type: string
      responses:
        '200':
          description: Produktų sąrašas
          content:
            application/json:
              example:
                data:
                - id: 1
                  name: Avižiniai dribsniai
                  caloriesPer100g: 370
                  proteinPer100g: 13
                  carbsPer100g: 60
                  fatPer100g: 7
                  createdAt: '2026-11-11T20:07:25.000Z'
                  updatedAt: '2026-11-11T20:07:25.000Z'
                - id: 11
                  name: Ryžiai virti
                  caloriesPer100g: 130
                  proteinPer100g: 2.7
                  carbsPer100g: 28
                  fatPer100g: 0.3
                  createdAt: '2026-11-11T20:07:25.000Z'
                  updatedAt: '2026-11-11T20:07:25.000Z'
                pagination:
                  page: 1
                  limit: 2
                  total: 3
                  pages: 2
                _links:
                  self: http://localhost:3000/api/foods?page=1&limit=2&search=vi
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Maisto katalogas
      summary: Naujas maisto produktas
      description: |-
        Prideda produktą į katalogą. Kurti gali bet kuris prisijungęs naudotojas.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: foods_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodInput'
            example:
              name: Kefyras 2,5%
              caloriesPer100g: 50
              proteinPer100g: 3
              carbsPer100g: 4
              fatPer100g: 2.5
      responses:
        '201':
          description: Produktas sukurtas
          content:
            application/json:
              example:
                id: 15
                name: Kefyras 2,5%
                caloriesPer100g: 50
                proteinPer100g: 3
                carbsPer100g: 4
                fatPer100g: 2.5
                updatedAt: '2026-11-11T20:08:01.229Z'
                createdAt: '2026-11-11T20:08:01.229Z'
        '422':
          description: Trūksta pavadinimo arba kalorijų
          content:
            application/json:
              example:
                error: 'Truksta lauku: caloriesPer100g'
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
  /foods/{foodId}:
    get:
      tags:
      - Maisto katalogas
      summary: Vienas maisto produktas
      description: |-
        Grąžina produkto maistinę vertę 100 g.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: foods_get
      parameters:
      - name: foodId
        in: path
        required: true
        description: Maisto produkto ID
        schema:
          type: integer
      responses:
        '200':
          description: Produktas
          content:
            application/json:
              example:
                id: 2
                name: Vištienos krūtinėlė
                caloriesPer100g: 165
                proteinPer100g: 31
                carbsPer100g: 0
                fatPer100g: 3.6
                createdAt: '2026-11-11T20:07:25.000Z'
                updatedAt: '2026-11-11T20:07:25.000Z'
        '404':
          description: Maisto produktas nerastas
          content:
            application/json:
              example:
                error: Maistas nerastas
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Maisto katalogas
      summary: Maisto produkto redagavimas
      description: |-
        Atnaujina produkto duomenis. Siunčiami tik keičiami laukai.

        **Prieiga:** Tik administratorius (Bearer žetonas)
      operationId: foods_update
      parameters:
      - name: foodId
        in: path
        required: true
        description: Maisto produkto ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodInput'
            example:
              caloriesPer100g: 52
      responses:
        '200':
          description: Produktas atnaujintas
          content:
            application/json:
              example:
                id: 15
                name: Kefyras 2,5%
                caloriesPer100g: 52
                proteinPer100g: 3
                carbsPer100g: 4
                fatPer100g: 2.5
                createdAt: '2026-11-11T20:08:01.000Z'
                updatedAt: '2026-11-11T20:08:01.252Z'
        '403':
          description: Redaguoti gali tik administratorius
          content:
            application/json:
              example:
                error: Neturite teisiu siam veiksmui
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Maisto produktas nerastas
          content:
            application/json:
              example:
                error: Maistas nerastas
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Maisto katalogas
      summary: Maisto produkto šalinimas
      description: |-
        Pašalina produktą iš katalogo. Produkto, kuris jau naudojamas valgymuose, ištrinti negalima.

        **Prieiga:** Tik administratorius (Bearer žetonas)
      operationId: foods_delete
      parameters:
      - name: foodId
        in: path
        required: true
        description: Maisto produkto ID
        schema:
          type: integer
      responses:
        '204':
          description: Produktas pašalintas
        '403':
          description: Šalinti gali tik administratorius
          content:
            application/json:
              example:
                error: Neturite teisiu siam veiksmui
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Maisto produktas nerastas
          content:
            application/json:
              example:
                error: Maistas nerastas
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Produktas naudojamas valgymo įrašuose
          content:
            application/json:
              example:
                error: Šis įrašas naudojamas kitur (pvz. valgymuose), todėl jo ištrinti negalima
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
  /goals:
    get:
      tags:
      - Tikslai
      summary: Tikslų sąrašas
      description: |-
        Paprastas naudotojas gauna tik savo tikslą, administratorius – visų naudotojų tikslus. Galima filtruoti pagal tipą ir pavadinimą.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: goals_list
      parameters:
      - name: page
        in: query
        required: false
        description: Puslapio numeris (numatytasis 1)
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Įrašų skaičius puslapyje (1–50, numatytasis 10)
        schema:
          type: integer
      - name: type
        in: query
        required: false
        description: weight_loss | maintain | muscle_gain
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Pavadinimo dalis
        schema:
          type: string
      responses:
        '200':
          description: Tikslų sąrašas su hipermedijos nuorodomis
          content:
            application/json:
              example:
                data:
                - id: 1
                  title: Mazinti svori
                  type: weight_loss
                  startWeightKg: 82
                  targetWeightKg: 76
                  heightCm: 178
                  age: 24
                  dailyCaloriesTarget: 1999
                  dailyProteinTarget: 148
                  createdAt: '2026-11-11T20:07:25.000Z'
                  updatedAt: '2026-11-11T20:07:25.000Z'
                  userId: 2
                  _links:
                    self: http://localhost:3000/api/goals/1
                    logs: http://localhost:3000/api/goals/1/logs
                    dashboard: http://localhost:3000/api/goals/1/dashboard
                    reports: http://localhost:3000/api/goals/1/reports
                    insights: http://localhost:3000/api/goals/1/insights
                pagination:
                  page: 1
                  limit: 10
                  total: 1
                  pages: 1
                _links:
                  self: http://localhost:3000/api/goals?page=1&limit=10
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Tikslai
      summary: Tikslo sukūrimas
      description: |-
        Sukuria prisijungusio naudotojo tikslą. Dienos kalorijų ir baltymų normos apskaičiuojamos automatiškai. Vienas naudotojas gali turėti vieną tikslą.

        **Prieiga:** Prisijungęs naudotojas (Bearer žetonas)
      operationId: goals_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
            example:
              title: Auginti raumenis
              type: muscle_gain
              startWeightKg: 68
              targetWeightKg: 73
              heightCm: 180
              age: 23
      responses:
        '201':
          description: Tikslas sukurtas
          content:
            application/json:
              example:
                id: 6
                title: Auginti raumenis
                type: muscle_gain
                startWeightKg: 68
                targetWeightKg: 73
                heightCm: 180
                age: 23
                dailyCaloriesTarget: 2631
                dailyProteinTarget: 136
                userId: 7
                updatedAt: '2026-11-11T20:08:01.399Z'
                createdAt: '2026-11-11T20:08:01.399Z'
                _links:
                  self: http://localhost:3000/api/goals/6
                  logs: http://localhost:3000/api/goals/6/logs
                  dashboard: http://localhost:3000/api/goals/6/dashboard
                  reports: http://localhost:3000/api/goals/6/reports
                  insights: http://localhost:3000/api/goals/6/insights
        '409':
          description: Naudotojas jau turi tikslą
          content:
            application/json:
              example:
                error: Jus jau turite tiksla. Vienam naudotojui leidziamas tik vienas tikslas.
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Trūksta privalomų laukų
          content:
            application/json:
              example:
                error: 'Truksta lauku: startWeightKg, targetWeightKg, heightCm, age'
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
  /goals/{goalId}:
    get:
      tags:
      - Tikslai
      summary: Vienas tikslas
      description: |-
        Grąžina tikslą su nuorodomis į jo dienos įrašus, suvestinę ir ataskaitas.

        **Prieiga:** Tikslo savininkas arba administratorius (Bearer žetonas)
      operationId: goals_get
      parameters:
      - name: goalId
        in: path
        required: true
        description: Tikslo ID
        schema:
          type: integer
      responses:
        '200':
          description: Tikslas
          content:
            application/json:
              example:
                id: 1
                title: Mazinti svori
                type: weight_loss
                startWeightKg: 82
                targetWeightKg: 76
                heightCm: 178
                age: 24
                dailyCaloriesTarget: 1999
                dailyProteinTarget: 148
                createdAt: '2026-11-11T20:07:25.000Z'
                updatedAt: '2026-11-11T20:07:25.000Z'
                userId: 2
                _links:
                  self: http://localhost:3000/api/goals/1
                  logs: http://localhost:3000/api/goals/1/logs
                  dashboard: http://localhost:3000/api/goals/1/dashboard
                  reports: http://localhost:3000/api/goals/1/reports
                  insights: http://localhost:3000/api/goals/1/insights
        '403':
          description: Tikslas priklauso kitam naudotojui
          content:
            application/json:
              example:
                error: Neturite teisiu siam tikslui
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tikslas nerastas
          content:
            application/json:
              example:
                error: Tikslas nerastas
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Tikslai
      summary: Tikslo redagavimas
      description: |-
        Atnaujina tikslą ir iš naujo apskaičiuoja kalorijų bei baltymų normas. Laukai userId ir id ignoruojami.

        **Prieiga:** Tikslo savininkas arba administratorius (Bearer žetonas)
      operationId: goals_update
      parameters:
      - name: goalId
        in: path
        required: true
        description: Tikslo ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
            example:
              targetWeightKg: 74
      responses:
        '200':
          description: Tikslas atnaujintas
          content:
            application/json:
              example:
                id: 6
                title: Auginti raumenis
                type: muscle_gain
                startWeightKg: 68
                targetWeightKg: 74
                heightCm: 180
                age: 23
                dailyCaloriesTarget: 2631
                dailyProteinTarget: 136
                createdAt: '2026-11-11T20:08:01.000Z'
                updatedAt: '2026-11-11T20:08:01.407Z'
                userId: 7
                _links:
                  self: http://localhost:3000/api/goals/6
                  logs: http://localhost:3000/api/goals/6/logs
                  dashboard: http://localhost:3000/api/goals/6/dashboard
                  reports: http://localhost:3000/api/goals/6/reports
                  insights: http://localhost:3000/api/goals/6/insights
        '403':
          description: Tikslas priklauso kitam naudotojui
          content:
            application/json:
              example:
                error: Neturite teisiu siam tikslui
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tikslas nerastas
          content:
            application/json:
              example:
                error: Tikslas nerastas
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nepateiktas arba negaliojantis prieigos žetonas
          content:
            application/json:
              example:
                error: Trukstą prisijungimo zetono
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Tikslai
      summary: Tikslo šalinimas
      description: |-
        Ištrina tikslą kartu su visais jo dienos įrašais ir valgymais.

        **Prieiga:** Tikslo savininkas arba administratorius (Bearer žetonas)
      operationId: goals_delete
      parameters:
      - name: goalId
        in: path
        required: true
        description: Tikslo ID
        schema:
          type: integer
      responses:
