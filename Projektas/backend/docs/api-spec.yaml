components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Prieigos žetonas iš /auth/login arba /auth/refresh. Payload: sub (naudotojo ID), role, iat, exp.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: Tikslas nerastas
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    Credentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT, galioja 15 min.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum:
          - user
          - admin
    FoodInput:
      type: object
      required:
      - name
