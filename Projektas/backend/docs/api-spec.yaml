          type: string
      responses:
        '200':
          description: Įžvalgos tekstas
          content:
            application/json:
              example:
                goalId: 1
                insight: |-
                  Pasirinkto savaites laikotarpio santrauka: 2800 kcal, 225.3 g baltymu, 244.7 g angliavandeniu ir 100.5 g riebalu.

                  Per pasirinkta laikotarpi suvartota apie 15191 kcal maziau nei tikslas.

                  Baltymu kiekis zemokas: 225.3 g is mazdaug 444 g laikotarpio tikslo.

                  Duomenu yra 3 dienoms, todel verta ziureti ne viena diena, o bendra tendencija.

                  Rekomendacijos: planuok pagrindinius valgymus is anksto, prie kiekvieno pagrindinio valgymo pridek baltymu saltini, o uzkandzius naudok tik tarpams uzpildyti, ne pagrindiniam kaloriju kiekiui surinkti.

                  Kitam laikotarpiui verta stebeti, ar kaloriju skirtumas kartojasi kasdien, ir pagal tai koreguoti porciju dydi, o ne pavienius atsitiktinius valgymus.
